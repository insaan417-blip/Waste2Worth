<script>
const $=i=>document.getElementById(i),P=Math.PI,F=(x,d=0)=>x.toLocaleString("en-IN",{maximumFractionDigits:d,minimumFractionDigits:d}),APP="https://claude.ai/artifact/Uk9HA66RfTKLCUN2opGcYS";
const Nm={pdf:z=>Math.exp(-z*z/2)/Math.sqrt(2*P),cdf(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p},inv(p){let l=-6,h=6;for(let i=0;i<50;i++){const m=(l+h)/2;Nm.cdf(m)<p?l=m:h=m}return(l+h)/2}};

const PRE={tiffin:{nm:"Tiffin service",u:"tiffin",pl:"tiffins",price:90,extra:15,budget:1800,habit:52,ing:[["Rice",120,"g",50],["Dal",40,"g",140],["Vegetables",100,"g",60],["Atta (for roti)",100,"g",40],["Cooking oil",10,"ml",150],["Spices",5,"g",400]]},

juice:{nm:"Juice / snack stall",u:"glass",pl:"glasses",price:40,extra:4,budget:1500,habit:70,ing:[["Fruit",200,"g",80],["Sugar",15,"g",45],["Ice",50,"g",5],["Cup",1,"pc",2]]},
sweet:{nm:"Sweet / bakery shop",u:"piece",pl:"pieces",price:25,extra:2,budget:1500,habit:90,ing:[["Milk",100,"ml",60],["Sugar",30,"g",45],["Dry fruits",5,"g",900],["Ghee",5,"ml",600],["Packing",1,"pc",2]]}};
const mkDB=t=>({cfg:{name:"My Kitchen",type:t,price:PRE[t].price,extra:PRE[t].extra,budget:PRE[t].budget,habit:PRE[t].habit,buf:5,url:""},ing:PRE[t].ing.map(a=>({n:a[0],q:a[1],u:a[2],pp:a[3]})),recs:[],bought:{},lb:[]});
let DB=mkDB("tiffin"),lang="en",tab="home",M=null,ovr=null;
const mem={},store={get(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};let ACC=null;
const save=()=>{if(ACC)store.set("w2wk3:"+ACC.phone,JSON.stringify(DB))},ld=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),dem=r=>r.sold+(r.turned||0),wd=r=>new Date(r.date+"T12:00").getDay();
const U=()=>PRE[DB.cfg.type],c1=i=>i.u=="pc"?i.q*i.pp:i.q/1000*i.pp,CPU=()=>DB.ing.reduce((a,i)=>a+c1(i),0)+DB.cfg.extra,PL={g:"₹ per kg",ml:"₹ per litre",pc:"₹ per piece"};
const setupOK=()=>DB.ing.length>0&&DB.cfg.price>CPU()&&CPU()>0;
function mk(d,f){const p=DB.cfg.price,c=CPU(),b=DB.cfg.budget,n=d.length,mu=d.reduce((a,x)=>a+x,0)/n,sd=Math.max(.5,Math.sqrt(d.reduce((a,x)=>a+(x-mu)**2,0)/(n-1)));let e=d[0];d.forEach(x=>e=.3*x+.7*e);const m=e*f,cr=(p-c)/p,z=Nm.inv(cr),q=m+z*sd,cap=Math.floor(b/c);return{p,c,b,s:0,g:DB.cfg.habit,n,mu,sd,m,f,cr,z,q,cap,Q:Math.max(0,Math.min(Math.round(q),cap)),capped:Math.round(q)>cap}}
function model(){if(DB.recs.length<3||!setupOK())return null;const rs=[...DB.recs].sort((a,b)=>a.date<b.date?-1:1),d=rs.map(dem),mu=d.reduce((a,x)=>a+x,0)/d.length,tw=new Date(Date.now()+864e5).getDay(),w=rs.filter(r=>wd(r)==tw).map(dem),k=w.length;return mk(d,k>=2?1+(w.reduce((a,x)=>a+x,0)/k/mu-1)*k/(k+3):1)}
function ex(M,Q){const z=(Q-M.m)/M.sd,ov=M.sd*(z*Nm.cdf(z)+Nm.pdf(z)),un=M.sd*(Nm.pdf(z)-z*(1-Nm.cdf(z)));return{ov,un,pr:M.p*(Q-ov)-M.c*Q+M.s*ov,sv:Nm.cdf(z)}}
const L=(M,c,D)=>M.p*Math.min(c,D)-M.c*c,rn=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*P*Math.random())};
function bulk(txt){const n=txt.split(/[ ,;\n]+/).filter(x=>x!=="").map(Number).filter(x=>x>=0&&isFinite(x)&&x!==""&&txt.trim()!=="");n.forEach((s,i)=>{const dt=ld(new Date(Date.now()-(n.length-i)*864e5));DB.recs=DB.recs.filter(r=>r.date!=dt);DB.recs.push({date:dt,cooked:null,sold:s,turned:0})});save();return n.length}

function ingRows(id,shop){return DB.ing.map((i,k)=>`<div class="ir"><input data-k="${k}" data-f="n" value="${i.n}"><input data-k="${k}" data-f="q" type="number" step="any" value="${i.q}"><select data-k="${k}" data-f="u"><option value="g"${i.u=="g"?" selected":""}>g</option><option value="ml"${i.u=="ml"?" selected":""}>ml</option><option value="pc"${i.u=="pc"?" selected":""}>pcs</option></select><input data-k="${k}" data-f="pp" type="number" step="any" value="${i.pp}"><button class="x" data-a="di" data-k="${k}">×</button></div>`).join("")}
const addF=p=>`<h3>+ Add an ingredient or item</h3><div class="ir"><input id="${p}n" placeholder="Name (e.g. Paneer)"><input id="${p}q" type="number" step="any" placeholder="Qty per ${U().u}"><select id="${p}u"><option value="g">g</option><option value="ml">ml</option><option value="pc">pcs</option></select><input id="${p}p" type="number" step="any" placeholder="₹ price"><button class="x" data-a="ai" data-p="${p}" style="color:var(--g)">＋</button></div><small>Price is ₹ per kg (g), per litre (ml) or per piece (pcs).</small>`;
function home(){const s1=setupOK(),s2=DB.recs.length>=3;const st=(ok,t,d,tb)=>`<div class="st"><i>${ok?"✅":"⭕"}</i><div><b>${t}</b><br><small>${d}</small></div><button class="p q" data-go="${tb}">${ok?"Edit":"Start"}</button></div>`;
$("home").innerHTML=`<div class="c"><h2>What is this app?</h2><p>Waste2Worth Kitchen tells a food business <b>how many to cook tomorrow</b>. It uses your past sales, your costs and a little statistics, so you avoid both wasted food and empty shelves.</p><div class="use"><div>🍱 <b>Tiffin services</b><br>Plan daily meal boxes</div><div>🍽 <b>Hostel mess &amp; canteens</b><br>Plan plates for hundreds</div><div>🥤 <b>Juice &amp; snack stalls</b><br>Buy only the fruit you will sell</div><div>🍬 <b>Sweet &amp; bakery shops</b><br>Bake the right batch size</div></div></div>
<div class="c"><h2>Get started in 4 steps</h2>${st(s1,"1 · Set up your menu and prices","Choose your business, then check ingredients and selling price","setup")}${st(s2,"2 · Add your recent sales","Needs at least 3 days. Takes 1 minute","log")}${st(s1&&s2,"3 · See tomorrow’s plan","The number to cook, with a safe range","plan")}${st(s1&&s2,"4 · Make your shopping list","Exact kg of each item, with cost. Tick items as you buy","shop")}</div>
<div class="c"><h2>Your daily 5-minute routine</h2><p><b>Evening:</b> open <i>Log</i>, enter how many you cooked, sold and turned away.<br><b>Morning:</b> open <i>Plan</i> to see how many to cook, then <i>Shop</i> for what to buy.<br><b>Weekly:</b> open <i>Report</i> to see waste, savings and your busiest days.</p><button class="p" data-a="demo">Try it with sample data</button></div>`}
function setup(){const c=DB.cfg,u=U();$("setup").innerHTML=`<div class="c h"><h2>1 · Your business</h2><label>Kitchen name</label><input id="sn" value="${c.name}"><label>I run a…</label><select id="sty">${Object.entries(PRE).map(([k,v])=>`<option value="${k}"${k==c.type?" selected":""}>${v.nm}</option>`).join("")}</select><button class="p q" data-a="tpl">Load typical prices &amp; ingredients</button><small>Optional. Replaces the ingredient list below with a typical one, which you can edit.</small>
<div class="r2"><div><label>Selling price per ${u.u} ₹</label><input id="sp" type="number" value="${c.price}"></div><div><label>Gas, packing, other ₹ per ${u.u}</label><input id="se" type="number" value="${c.extra}"></div><div><label>Max daily spend on food ₹</label><input id="sb" type="number" value="${c.budget}"></div><div><label>I usually cook (${u.pl})</label><input id="sh" type="number" value="${c.habit}"></div></div><div id="cs"></div></div>

function bindIng(id){const el=$(id);if(!el)return;el.querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>{const it=DB.ing[+i.dataset.k],f=i.dataset.f;it[f]=f=="n"||f=="u"?i.value:+i.value;save();cs();if(tab=="shop")shopT()})}
function addIng(p){const n=$(p+"n").value.trim(),q=+$(p+"q").value,pp=+$(p+"p").value;if(!n||!(q>0)||!(pp>=0)||$(p+"p").value===""){alert("Enter a name, quantity per "+U().u+" and a price.");return}DB.ing.push({n,q,u:$(p+"u").value,pp});save();go(tab)}
function logv(){const rs=[...DB.recs].sort((a,b)=>a.date<b.date?1:-1);$("log").innerHTML=`<div class="c h"><h2>Record a day</h2><p class="m">Do this every evening. It takes 10 seconds.</p><div class="r2"><div><label>Date</label><input id="ld" type="date" value="${ld(new Date())}"></div><div><label>${U().pl} cooked</label><input id="lc" type="number" min="0"></div><div><label>${U().pl} sold</label><input id="ls" type="number" min="0"></div><div><label>Customers turned away</label><input id="lt" type="number" min="0" value="0"></div></div><small>Turned away = people who wanted one after you ran out. This shows hidden demand.</small><br><button class="p" data-a="la">Save day</button><div id="lm" class="cap"></div>
<h3>Or add many past days at once</h3><input id="lb" placeholder="Sales numbers, oldest first: 42, 45, 40, 48"><button class="p q" data-a="qs" data-i="lb">Add these days</button><button class="p q" data-a="smp">Load sample data</button></div>
<div class="c h"><h2>History (${rs.length} days)</h2><div style="max-height:360px;overflow:auto">${rs.length?`<table><tr><th>Date</th><th>Cooked</th><th>Sold</th><th>Away</th><th></th></tr>${rs.slice(0,60).map(r=>`<tr><td>${r.date}</td><td>${r.cooked??"–"}</td><td>${r.sold}</td><td>${r.turned||0}</td><td><button class="x" data-a="dr" data-d="${r.date}">×</button></td></tr>`).join("")}</table>`:"<small>No days yet. Add your first day on the left.</small>"}</div><button class="p q" data-a="csv">Copy as CSV</button><button class="p q" data-a="clr">Clear all</button></div>`}
function plan(){M=model();const el=$("plan"),t=new Date(Date.now()+864e5),u=U();
if(!setupOK()){el.innerHTML=`<div class="c"><h2>Step 3 · Tomorrow’s plan</h2><div class="warn">First set up your ingredients and prices (Step 1). The plan needs your selling price and cost.</div><button class="p" data-go="setup">Go to Setup</button></div>`;return}

const E=ex(M,M.Q),lo=Math.round(M.m-2*M.sd),hi=Math.round(M.m+2*M.sd),G=ex(M,M.g);
el.innerHTML=`<div class="c"><h2>${t.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})}: cook</h2><div class="big">${M.Q}</div><div class="cap">${lang=="en"?u.pl:"टिफ़िन"} · safe range ${lo}–${hi}</div>
<div class="kp"><div><b>${F(E.sv*100)}%</b>days fully served</div><div><b>${F(E.ov,1)}</b>wasted / day</div><div><b>${F(E.un,1)}</b>missed / day</div><div><b>₹${F(E.pr)}</b>profit / day</div></div>
${M.capped?`<div class="warn">Your food budget (₹${F(M.b)}) limits you to ${M.cap}. The ideal number is ${Math.round(M.q)}.</div>`:""}<div class="warn ok">Your usual ${M.g} would waste about ${F(G.ov,1)} ${u.pl} a day (₹${F(G.ov*M.c)}). Following this plan could add ≈ ₹${F((E.pr-G.pr)*30)} a month.</div>
<button class="p" data-go="shop">Make shopping list →</button><button class="p q" data-a="wa">Send on WhatsApp</button><button class="p q" data-go="log">Log today’s sales</button></div>
<div class="c h"><h2>Demand forecast</h2><div id="bell"></div><small>Green: 95% of days. Amber: your number.${M.capped?" Red: budget limit.":""}</small></div>
<div class="c h"><h2>How this number is made</h2><p class="m">1. We average your recent sales, giving newer days more weight, and adjust for the weekday (${DAYS[t.getDay()]}).<br>2. We measure how much your sales jump around (±${F(M.sd,1)}).<br>3. Running short loses ₹${F(M.p-M.c,0)} per ${u.u}; leftover wastes ₹${F(M.c,0)}. We balance the two, so you cook a bit ${M.z>=0?"above":"below"} the average.</p><details><summary>Show the formula</summary><p>Q = μ + z·σ with z = Φ⁻¹((p−c)/p) = ${F(M.z,2)}, μ = ${F(M.m,1)}, σ = ${F(M.sd,2)}, capped by budget ÷ cost.</p></details></div>`;bell()}

function report(){const rs=DB.recs,c=CPU(),s=Array(7).fill(0),n=Array(7).fill(0);rs.forEach(r=>{s[wd(r)]+=dem(r);n[wd(r)]++});const av=s.map((x,i)=>n[i]?x/n[i]:0),mx=Math.max(...av,1),w=rs.filter(r=>r.cooked!=null),wt=w.reduce((a,r)=>a+Math.max(r.cooked-dem(r),0),0),sv=w.reduce((a,r)=>a+Math.max(DB.cfg.habit-dem(r),0)-Math.max(r.cooked-dem(r),0),0);

const AU={users(){try{return JSON.parse(store.get("w2w_users"))||{}}catch(e){return{}}},put(u){store.set("w2w_users",JSON.stringify(u))}},b64e=u=>btoa(String.fromCharCode(...u)),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hp(pw,salt){if(!(window.crypto&&crypto.subtle))throw new Error("nocrypto");const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return b64e(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(salt),iterations:150000,hash:"SHA-256"},k,256)))}

a.innerHTML=`<div class="ac"><h2>♻ Waste2Worth Kitchen</h2>${amode=="fg"?`<p class="m">Reset a forgotten password</p><div class="warn">Your data is stored only on this device, so a password cannot be recovered. You can reset the account: <b>its saved data on this device is deleted</b> and you can create the account again.</div><label>Mobile number</label><input id="ap" inputmode="numeric" placeholder="9876543210"><div id="ae" class="warn" style="display:none"></div><button class="p" id="arst" style="width:100%">Delete account &amp; reset</button><p class="cap"><a href="#" data-am="in">Back to sign in</a></p>`:`<p class="m">${up?"Create your account in 20 seconds":"Sign in with your mobile number"}</p><div class="tabs2"><button class="${up?"":"on"}" data-am="in">Sign in</button><button class="${up?"on":""}" data-am="up">Create account</button></div>${up?`<label>Your name</label><input id="an" autocomplete="name">`:""}<label>Mobile number (10 digits)</label><input id="ap" inputmode="numeric" maxlength="14" autocomplete="username" placeholder="9876543210"><label>Password (at least 6 characters)</label><input id="aw" type="password" autocomplete="${up?"new-password":"current-password"}">${up?`<label>Confirm password</label><input id="ac2" type="password" autocomplete="new-password">`:""}<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="ar" style="width:auto" checked>Keep me signed in on this device</label><div id="ae" class="warn" style="display:none"></div><button class="p" id="ago" style="width:100%">${up?"Create account &amp; start tour":"Sign in"}</button>${up?"":`<p class="cap"><a href="#" data-am="fg">Forgot password?</a></p>`}<small>Accounts live on this device only. Your password is hashed and never sent anywhere.</small>`}</div>`}

async function authGo(){const ph=phn($("ap").value),pw=$("aw").value,us=AU.users();if(!/^[6-9]\d{9}$/.test(ph))return AE("Enter a valid 10-digit Indian mobile number.");if(Date.now()<lock)return AE("Too many attempts. Try again in "+Math.ceil((lock-Date.now())/1000)+" seconds.");
try{if(amode=="up"){const nm=$("an").value.trim();if(nm.length<2)return AE("Enter your name.");if(pw.length<6)return AE("Password must be at least 6 characters.");if(pw!==$("ac2").value)return AE("The two passwords do not match.");if(us[ph])return AE("This number already has an account. Please sign in.");const salt=b64e(crypto.getRandomValues(new Uint8Array(16))),first=!Object.keys(us).length;us[ph]={name:nm,salt,hash:await hp(pw,salt)};AU.put(us);if(first){const old=store.get("w2wk2");if(old&&!store.get("w2wk3:"+ph))store.set("w2wk3:"+ph,old)}login(ph,$("ar").checked,true)}
